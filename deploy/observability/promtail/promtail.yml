server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: elara-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: elara-files
          __path__: /var/log/elara/*.log

  - job_name: elara-runtime-events
    static_configs:
      - targets:
          - localhost
        labels:
          job: elara-runtime-events
          __path__: /var/log/elara/runtime/*.jsonl

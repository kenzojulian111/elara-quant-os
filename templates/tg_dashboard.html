<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elara Telegram Control</title>
    <meta name="csrf-token" content="{{ csrf_token_value }}">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/elara-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/elara-tg.css') }}">
</head>
<body>
    <div class="shell">
        <header class="head">
            <span class="kicker">Live Telegram Link</span>
            <h1 class="title">Elara Quick Control</h1>
            <p class="sub">Command center ringkas untuk operasi harian dan emergency action.</p>
        </header>

        <main class="content">
            <div class="grid">
                <button class="primary" onclick="sendCmd('trading_status')">Trading Status</button>
                <button class="primary" onclick="sendCmd('get_daily_briefing')">Daily Briefing</button>
                <button onclick="sendCmd('nyalakan lampu ruang_tamu')">Lampu ON</button>
                <button onclick="sendCmd('matikan lampu ruang_tamu')">Lampu OFF</button>
                <button onclick="sendCmd('nyalakan ac ruang_tamu suhu 20')">AC 20C</button>
                <button onclick="sendCmd('matikan ac ruang_tamu')">AC OFF</button>
                <button class="full danger" onclick="sendCmd('security_audit')">Security Audit</button>
            </div>
            <div class="log-wrap">
                <h2 class="log-title">Command Log</h2>
                <p class="log" id="log">Ready.</p>
            </div>
        </main>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); }
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || '';
        const csrfToken = (document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '').trim();

        async function sendCmd(cmd) {
            const log = document.getElementById('log');
            log.className = 'log';
            log.innerText = 'Sending...';
            try {
                const res = await fetch('/api/tg/control', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-TG-TOKEN': token,
                        ...(csrfToken ? { 'X-CSRFToken': csrfToken, 'X-CSRF-Token': csrfToken } : {}),
                    },
                    body: JSON.stringify({ command: cmd })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    log.className = 'log err';
                    log.innerText = data.message || 'Command rejected.';
                    return;
                }
                log.className = 'log ok';
                log.innerText = data.message || 'OK';
            } catch (e) {
                log.className = 'log err';
                log.innerText = 'Error sending command.';
            }
        }
    </script>
</body>
</html>

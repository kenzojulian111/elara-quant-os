<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elara Account Center</title>
    <meta name="csrf-token" content="{{ csrf_token_value }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/elara-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/elara-account.css') }}">
</head>
<body>
<main class="account-shell">
    <section class="account-topbar card">
        <div>
            <h1>Account Center</h1>
            <p id="whoami">Memuat profile...</p>
        </div>
        <div class="toolbar">
            <button class="btn" id="open-portal" type="button">Back to Portal</button>
            <button class="btn danger" id="logout-btn" type="button">Logout</button>
        </div>
    </section>

    <section class="card">
        <h2>Profile</h2>
        <div class="meta-grid">
            <div><span>Email</span><strong id="meta-email">-</strong></div>
            <div><span>Role</span><strong id="meta-role">-</strong></div>
            <div><span>Email Verified</span><strong id="meta-verified">-</strong></div>
            <div><span>MFA Enabled</span><strong id="meta-mfa">-</strong></div>
        </div>

        <form id="profile-form" class="stack-form">
            <label for="profile-name">Display Name</label>
            <input id="profile-name" type="text" maxlength="80" placeholder="your display name">
            <button class="btn primary" id="profile-save-btn" type="submit">Save Profile</button>
        </form>
    </section>

    <section class="card">
        <h2>Change Password</h2>
        <form id="password-form" class="stack-form">
            <label for="current-password">Current Password</label>
            <input id="current-password" type="password" autocomplete="current-password" required>
            <label for="new-password">New Password</label>
            <input id="new-password" type="password" autocomplete="new-password" required>
            <label for="new-password-confirm">Confirm New Password</label>
            <input id="new-password-confirm" type="password" autocomplete="new-password" required>
            <button class="btn primary" id="password-save-btn" type="submit">Update Password</button>
        </form>
    </section>

    <section class="card">
        <h2>Email Verification</h2>
        <form id="verify-request-form" class="stack-form">
            <label for="verify-email">Email (optional)</label>
            <input id="verify-email" type="email" placeholder="leave empty to use current session email">
            <button class="btn" id="verify-request-btn" type="submit">Request Verify Token</button>
        </form>
        <form id="verify-confirm-form" class="stack-form">
            <label for="verify-token">Verification Token</label>
            <input id="verify-token" type="text" maxlength="512" placeholder="paste token" required>
            <button class="btn" id="verify-confirm-btn" type="submit">Confirm Verification</button>
        </form>
    </section>

    <section class="card" id="admin-mfa-card" hidden>
        <h2>Admin 2FA (TOTP)</h2>
        <div class="mfa-note" id="mfa-note">Setup authenticator secret terlebih dulu, lalu enable dengan OTP 6 digit.</div>
        <div class="mfa-secret" id="mfa-secret" hidden>
            <div><span>Secret</span><code id="mfa-secret-text">-</code></div>
            <div><span>otpauth URI</span><code id="mfa-uri-text">-</code></div>
        </div>
        <div class="row-actions">
            <button class="btn" id="mfa-setup-btn" type="button">Generate / Rotate Secret</button>
            <button class="btn" id="mfa-refresh-btn" type="button">Refresh Status</button>
        </div>
        <form id="mfa-enable-form" class="stack-form">
            <label for="mfa-enable-otp">OTP to Enable</label>
            <input id="mfa-enable-otp" type="text" maxlength="6" inputmode="numeric" placeholder="6 digit">
            <button class="btn primary" id="mfa-enable-btn" type="submit">Enable MFA</button>
        </form>
        <form id="mfa-disable-form" class="stack-form">
            <label for="mfa-disable-otp">OTP to Disable</label>
            <input id="mfa-disable-otp" type="text" maxlength="6" inputmode="numeric" placeholder="6 digit">
            <button class="btn danger" id="mfa-disable-btn" type="submit">Disable MFA</button>
        </form>
    </section>

    <div class="error" id="error-msg"></div>
    <div class="info" id="info-msg"></div>
</main>

<script src="{{ url_for('static', filename='js/elara-account.js') }}"></script>
</body>
</html>
